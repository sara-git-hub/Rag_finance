[pytest]
# Configuration pytest pour Fil Rouge

# Paths
pythonpath = ../src .
testpaths = .

# Patterns de découverte des tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Options par défaut
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=../src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    -p no:warnings

# Markers personnalisés
markers =
    unit: Tests unitaires (services, models, helpers)
    integration: Tests d'intégration (API endpoints)
    ml: Tests machine learning (LSTM)
    slow: Tests lents (à exclure en dev)
    auth: Tests d'authentification
    admin: Tests fonctionnalités admin
    rag: Tests pipeline RAG
    db: Tests base de données

# Asyncio configuration
asyncio_mode = auto

# Coverage configuration
[coverage:run]
source = ../src
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
