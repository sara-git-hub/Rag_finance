name: Unit Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r src/requirements-test.txt

    - name: Create test environment file
      run: |
        cat > src/.env << 'EOF'
        APP_NAME=TestApp
        APP_VERSION=1.0.0
        SECRET_KEY=test-secret-key-for-ci-cd-testing-only
        FILE_ALLOWED_TYPES=["application/pdf","text/plain"]
        FILE_MAX_SIZE=10485760
        FILE_DEFAULT_CHUNK_SIZE=500
        POSTGRES_USERNAME=test_user
        POSTGRES_PASSWORD=test_pass
        POSTGRES_HOST=localhost
        POSTGRES_PORT=5432
        POSTGRES_MAIN_DATABASE=minirag_test
        CLE_API_CHANGES=test_key_1
        CLE_API_CHANGES_2=test_key_2
        GENERATION_BACKEND=groq
        EMBEDDING_BACKEND=local
        VECTOR_DB_BACKEND=qdrant
        VECTOR_DB_PATH=/tmp/test_qdrant
        EOF

    - name: Run unit tests
      run: |
        cd tests
        pytest unit/ -v --cov=../src --cov-report=xml --cov-report=term-missing

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: always()
      with:
        file: ./tests/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Generate coverage badge
      if: github.ref == 'refs/heads/main'
      run: |
        COVERAGE=$(grep -oP 'TOTAL.*?\K[0-9]+(?=%)' tests/coverage.xml || echo "0")
        echo "Coverage: ${COVERAGE}%"

    - name: Comment PR with coverage
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const coverage = fs.readFileSync('tests/coverage.xml', 'utf8');
          const match = coverage.match(/line-rate="([0-9.]+)"/);
          const percentage = match ? (parseFloat(match[1]) * 100).toFixed(2) : '0';

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## Test Coverage Report\n\n:white_check_mark: Unit tests passed!\n\n**Coverage:** ${percentage}%`
          });
