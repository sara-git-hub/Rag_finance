[pytest]
# Pytest configuration

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Coverage options (when running with --cov)
# Run with: pytest --cov=services --cov-report=html

# Markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may be slower)
    requires_api: Tests requiring API keys (OpenAI, Cohere)
    slow: Slow tests

# Asyncio configuration
asyncio_mode = auto

# Timeout (optional)
# timeout = 300
